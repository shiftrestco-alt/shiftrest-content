<title>Jordan Belfort's Internship Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: photo banner, then a sticky tab bar; one centered working column; drawers slide in from the right for compose/edit. Money green + gold. */
:root{
  --paper:#F2F4F2; --surface:#FFFFFF; --sunk:#E8ECE9; --ink:#121714; --muted:#56605A; --line:#D7DDD9;
  --accent:#17663F; --accent-ink:#FFFFFF; --accent-soft:#E0EFE6; --gold:#8E6A0E;
  --av1:#2F62B8; --av2:#0E7C7B; --av3:#9A6F00; --av4:#8A3FA0; --av5:#C2491D;
  --ok:#1D7348; --ok-soft:#E3F2EA; --warn:#9A5B00; --warn-soft:#FBEFD9; --bad:#AE2A20; --bad-soft:#FBE6E3; --info:#2B58A3; --info-soft:#E4ECF8;
  --display:"Archivo",ui-sans-serif,system-ui,sans-serif; --body:"Archivo",ui-sans-serif,system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1311; --surface:#171C19; --sunk:#202622; --ink:#ECEFEC; --muted:#99A39D; --line:#2B332E;
  --accent:#5DCB92; --accent-ink:#07160E; --accent-soft:#163323; --gold:#E2B64E;
  --av1:#7FA8F2; --av2:#4FC6C3; --av3:#E2B64E; --av4:#C88BE0; --av5:#F08A5E;
  --ok:#55C990; --ok-soft:#163327; --warn:#E6A84A; --warn-soft:#3A2C14; --bad:#F2766B; --bad-soft:#3D1E1B; --info:#86AAF0; --info-soft:#1C2A44; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1311; --surface:#171C19; --sunk:#202622; --ink:#ECEFEC; --muted:#99A39D; --line:#2B332E;
  --accent:#5DCB92; --accent-ink:#07160E; --accent-soft:#163323; --gold:#E2B64E;
  --av1:#7FA8F2; --av2:#4FC6C3; --av3:#E2B64E; --av4:#C88BE0; --av5:#F08A5E;
  --ok:#55C990; --ok-soft:#163327; --warn:#E6A84A; --warn-soft:#3A2C14; --bad:#F2766B; --bad-soft:#3D1E1B; --info:#86AAF0; --info-soft:#1C2A44; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:14px;line-height:1.45;font-variation-settings:"wdth" 100}
a{color:var(--info)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.brand b{font-family:var(--display);font-weight:800;font-stretch:80%;font-size:19px;letter-spacing:.01em;text-transform:uppercase}
.brand span{color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
.conn{display:flex;gap:6px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.conn i{font-style:normal;padding:2px 7px;border-radius:99px;background:var(--sunk)}
.conn i.on{background:var(--ok-soft);color:var(--ok)}

main{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 80px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h2{font-size:15px;font-weight:800;font-stretch:85%;text-transform:uppercase;letter-spacing:.05em}
h3{font-size:15px;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.section{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px 16px}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.small{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.urgent{background:var(--bad-soft);color:var(--bad)} .chip.soon{background:var(--warn-soft);color:var(--warn)}
.chip.open{background:var(--ok-soft);color:var(--ok)} .chip.neutral{background:var(--info-soft);color:var(--info)}
.st-todo{background:var(--sunk);color:var(--muted)} .st-sent,.st-fu1,.st-fu2{background:var(--info-soft);color:var(--info)}
.st-replied{background:var(--warn-soft);color:var(--warn)} .st-call,.st-referral,.st-interview{background:var(--ok-soft);color:var(--ok)}
.st-noreply,.st-declined,.st-bounced{background:var(--bad-soft);color:var(--bad)}
.persona{font-size:11px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}

/* KPI strip */
.kpis{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px}
@media (max-width:860px){.kpis{grid-template-columns:1fr 1fr}.kpis .goal{grid-column:1/-1}}
.kpi{padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.kpi .val{font-family:var(--mono);font-size:26px;font-weight:500;line-height:1.1}
.kpi .val small{font-size:14px;color:var(--muted)}
.meter{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden;display:flex}
.meter b{display:block;height:100%;background:var(--accent)}
.meter b.fu{background:var(--gold)}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted)}

.deadlines{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.dl{flex:0 0 auto;padding:10px 12px;border-left:4px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:200px;max-width:280px}
.dl.urgent{border-left-color:var(--bad)} .dl.soon{border-left-color:var(--warn)} .dl.later{border-left-color:var(--info)}
.dl .days{font-family:var(--mono);font-size:20px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.two>*{min-width:0}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item .who{min-width:0}
.item .who b{font-weight:700}
.item .meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:22px 16px;color:var(--muted);text-align:left}

/* table */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:var(--sunk)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
select.stage{border:0;border-radius:99px;padding:3px 8px;font-size:12px;font-weight:700;cursor:pointer}
.li{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 5px;border-radius:4px;background:var(--info-soft);color:var(--info);text-decoration:none}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=email],input[type=url],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
textarea{width:100%;resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{font-weight:400;color:var(--ink);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.grid2 .full{grid-column:1/-1}

/* firm cards */
.firms{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
@media (max-width:400px){.firms{grid-template-columns:1fr}}
.firm{display:flex;flex-direction:column;gap:8px;padding:14px 16px;min-width:0}
.firm .rank{font-family:var(--mono);color:var(--muted);font-size:12px}
.firm .av{font-family:var(--display);font-style:italic;font-weight:600}
.firm dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:12.5px}
.firm dt{color:var(--muted);font-weight:600}
.firm dd{margin:0}
.funnel{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.funnel b{font-family:var(--mono);font-size:16px;color:var(--ink);display:block;font-weight:500}

/* experiments */
.dims{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
@media (max-width:420px){.dims{grid-template-columns:1fr}}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;min-width:60px}
.bar b{display:block;height:100%;background:var(--ok)}
.lowN{color:var(--muted);font-size:10px;font-family:var(--mono)}
.variants{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
@media (max-width:420px){.variants{grid-template-columns:1fr}}
.var{padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.var.off{opacity:.55}
.var .subj{font-weight:700}
.var pre{white-space:pre-wrap;font-family:var(--body);margin:0;font-size:12.5px;color:var(--muted);max-height:7.5em;overflow:hidden}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.tag b{color:var(--ink);font-weight:600}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,10,14,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.drawer .body{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;flex:1}
.drawer footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.note{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:8px 10px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.counter{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* playbook */
.play{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
@media (max-width:400px){.play{grid-template-columns:1fr}}
.play article{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.play article .k{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.play p,.play ul{margin:0;font-size:13.5px;max-width:65ch}
.play ul{padding-left:18px;display:flex;flex-direction:column;gap:3px}

/* banner: one fixed dark look over the photo, in both themes */
.banner{position:relative;overflow:hidden;background:#0A0F0C;color:#F4EBCF;isolation:isolate}
.banner-bg{position:absolute;inset:-30px;background:url(banner.webp) center 35%/cover no-repeat;filter:blur(16px) brightness(.42) saturate(1.25);z-index:-1}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,10,8,.92) 0%,rgba(6,10,8,.55) 55%,rgba(6,10,8,.2) 100%);z-index:-1}
.banner-inner{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:22px;display:flex;gap:24px;align-items:center;justify-content:space-between}
.banner-copy{display:flex;flex-direction:column;gap:8px;min-width:0}
.banner .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#D9B95A}
.banner h1{font-family:var(--display);font-weight:800;font-stretch:75%;text-transform:uppercase;font-size:clamp(30px,5.4vw,52px);line-height:.95;letter-spacing:.005em;color:#F7EFD6}
.banner h1 em{font-style:normal;color:#E2BF5C}
.banner p{margin:0;max-width:52ch;color:#D6DCD6;font-size:14.5px}
.banner-photo{width:300px;max-width:42%;aspect-ratio:383/234;object-fit:cover;border-radius:6px;border:1px solid rgba(226,191,92,.55);box-shadow:0 10px 30px rgba(0,0,0,.5);flex:0 0 auto}
.banner small{display:block;font-size:10.5px;color:#8E978F}
@media (max-width:640px){.banner-inner{flex-direction:column-reverse;align-items:flex-start}.banner-photo{max-width:100%;width:100%}}

/* avatars */
.avatar{--c:var(--av1);display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;flex:0 0 auto;color:var(--c);border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.avatar svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.avatar.sm{width:18px;height:18px;border-width:1px;vertical-align:-4px;margin-right:5px}
.avatar.lg{width:46px;height:46px;border-width:2px}
.persona{white-space:nowrap}

/* road to 1,000 */
.road{padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px}
.road .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.road-title{font-size:clamp(30px,5vw,44px);font-family:var(--mono);font-weight:500;text-transform:none;letter-spacing:0;line-height:1.05}
.road-title small{font-size:15px;color:var(--muted);font-family:var(--body)}
.road-track{position:relative;height:18px;background:var(--sunk);border-radius:99px;margin-block:18px 8px}
.road-track>b{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--gold)));min-width:18px}
.road-track>i{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--line);transform:translateX(-1px)}
.road-track>i.hit{background:var(--gold)}
.road-track>i span{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.road-track>i:last-child span{transform:translateX(-100%)}
.miles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media (max-width:640px){.miles{grid-template-columns:repeat(2,1fr)}}
.mile{border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;display:flex;flex-direction:column;min-width:0}
.mile b{font-family:var(--mono);font-weight:500}
.mile.hit{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--surface))}
.mile.next{border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:700px){.stats{grid-template-columns:1fr 1fr}}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--mono);font-size:20px}
.funnel2{display:flex;flex-direction:column;gap:7px}
.fstep{display:grid;grid-template-columns:110px 1fr 120px;gap:10px;align-items:center;font-size:13px}
@media (max-width:520px){.fstep{grid-template-columns:86px 1fr 92px}}
.fstep .fb{height:22px;background:var(--sunk);border-radius:4px;overflow:hidden}
.fstep .fb b{display:block;height:100%;background:var(--accent);opacity:.85;border-radius:4px;min-width:3px}
.fstep .fn{font-family:var(--mono);font-size:12px;text-align:right;color:var(--muted)}
.fstep .fn b{color:var(--ink);font-weight:500;font-size:14px}
.lanes{display:flex;flex-direction:column}
.lane{display:grid;grid-template-columns:auto minmax(150px,1.2fr) 2fr auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.lane:first-child{border-top:0}
@media (max-width:720px){.lane{grid-template-columns:auto 1fr}.lane .segs,.lane .lnums{grid-column:1/-1}}
.lane .nm{display:flex;flex-direction:column;min-width:0}
.lane .nm b{font-family:var(--display);font-weight:700}
.segs{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.segs span{display:block;height:100%}
.lnums{display:flex;gap:14px;font-size:12px;color:var(--muted);white-space:nowrap}
.lnums b{font-family:var(--mono);color:var(--ink);font-weight:500;font-size:14px;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:8px;z-index:60;font-weight:600;font-size:13px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<section class="banner" aria-label="Jordan Belfort's Internship Program">
  <div class="banner-bg"></div>
  <div class="banner-inner">
    <div class="banner-copy">
      <span class="eyebrow">Boden Grimes · Summer 2027 recruiting desk</span>
      <h1>Jordan Belfort's<br><em>Internship Program</em></h1>
      <p id="banner-line">Act as if. Write like the analyst they already want to hire.</p>
      <small>A fan tribute. Not affiliated with Jordan Belfort.</small>
    </div>
    <img class="banner-photo" src="banner.webp" alt="Leonardo DiCaprio as Jordan Belfort, grinning and holding up a dollar bill at his desk" width="383" height="234">
  </div>
</section>
<header class="top">
  <div class="top-inner">
    <div class="brand"><b>The Desk</b><span>Jordan Belfort's Internship Program</span></div>
    <nav class="tabs" id="tabs" aria-label="Views">
      <button data-view="today">Today</button>
      <button data-view="pipeline">Pipeline</button>
      <button data-view="firms">Firms</button>
      <button data-view="tests">Experiments</button>
      <button data-view="playbook">Playbook</button>
      <button data-view="settings">Settings</button>
    </nav>
    <div class="conn" id="conn"><i id="c-db">Database</i><i id="c-gm">Gmail</i><i id="c-ai">Claude</i></div>
  </div>
</header>

<main id="main">
  <div class="panel pad empty" id="boot">Opening the desk…</div>
</main>

<div id="toast" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog"></aside>

<script>
(() => {
"use strict";
// ---------- constants ----------
const STAGES = [
  ["todo","Not contacted"],["sent","Emailed"],["fu1","Follow-up 1 sent"],["fu2","Follow-up 2 sent"],
  ["replied","Replied"],["call","Call booked"],["referral","Referral / resume fwd"],["interview","Interview"],
  ["noreply","No reply"],["declined","Declined"],["bounced","Bounced"]];
const STAGE_LABEL = Object.fromEntries(STAGES);
const AWAITING = ["sent","fu1","fu2"];
const REPLIED = ["replied","call","referral","interview","declined"];
const POSITIVE = ["call","referral","interview"];
const PERSONAS = ["Technician","Team Player","MD / Partner","Gatekeeper","Warm intro"];
const DESIRES = {"Technician":"Proof you can do the work","Team Player":"Someone reliable they'd staff","MD / Partner":"Relevance and a reason to care","Gatekeeper":"Eligibility, clarity, zero extra work","Warm intro":"A fellow alum worth helping"};

// ---------- state ----------
const S = { firms:new Map(), contacts:new Map(), variants:new Map(),
  settings:{dailyGoal:50, followUpDays:[3,7], signature:"Best,\nBoden Grimes", fu1Subject:"Re: {subject}", fu1Body:"Hi {first},\n\nBumping this in case it got buried.\n\n{signature}", fu2Subject:"Re: {subject}", fu2Body:"Hi {first},\n\nLast note from me.\n\n{signature}"},
  loaded:{firms:false,contacts:false,variants:false}, view:"today",
  f:{firm:"",stage:"",persona:"",q:""}, vf:{firm:"",persona:""} };
let db=null, sample=null, mcp=null, canWrite=true;

const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nowISO = () => new Date().toISOString();
const dayKey = d => { const x=new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const todayKey = () => dayKey(Date.now());
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric"}) : "—";
const pct = (a,b) => b ? Math.round(100*a/b) : 0;
const uid = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function addBusinessDays(from, n){ const d=new Date(from); let k=0; while(k<n){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w!==0&&w!==6) k++; } d.setHours(8,0,0,0); return d.toISOString(); }
function daysUntil(dateStr){ const t=new Date(dateStr+"T23:59:00"); return Math.ceil((t - new Date())/86400000); }

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3200); }
async function copy(text, what){ try{ await navigator.clipboard.writeText(text); toast(what+" copied"); }catch{ toast("Copy blocked here. Select the text and copy it manually."); } }

// ---------- merge fields ----------
function nameParts(name){ const clean=String(name||"").replace(/["“”].*?["“”]/g,"").replace(/\b(Jr|Sr|II|III)\.?$/,"").trim(); const p=clean.split(/\s+/).filter(Boolean); const first=p[0]||""; const last=(p.filter(x=>!/^[A-Z]\.$/.test(x)).slice(1).pop())||""; return {first,last}; }
function fill(tpl, c, extra={}){
  const f = S.firms.get(c?.firmId)||{}; const {first,last}=nameParts(c?.name);
  const map = {first, last, firm: shortFirm(f.name||""), role:c?.role||"", signature:S.settings.signature||"", subject:extra.subject||c?.subject||""};
  return String(tpl||"").replace(/\{(\w+)\}/g,(m,k)=> k in map ? map[k] : m);
}
function shortFirm(n){ return n.split(":")[0].replace(/\s*\(.*\)/,"").trim(); }
function guessEmail(name, firm){
  if(!firm?.emailPattern) return "";
  const {first,last}=nameParts(name); const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z]/g,"");
  return firm.emailPattern.replace("{first}",norm(first)).replace("{last}",norm(last)).replace("{f}",norm(first).slice(0,1));
}

// ---------- derived ----------
const contactsArr = () => [...S.contacts.values()];
const firmName = id => S.firms.get(id)?.name || "Unknown firm";
function sentContacts(){ return contactsArr().filter(c=>c.sentAt); }
function touchesOn(day, kinds){ let n=0; for(const c of S.contacts.values()) for(const t of (c.touches||[])) if(dayKey(t.at)===day && (!kinds||kinds.includes(t.kind))) n++; return n; }
function dueFollowUps(){ const now=Date.now(); return contactsArr().filter(c=>AWAITING.includes(c.stage) && c.nextFollowUpAt && new Date(c.nextFollowUpAt).getTime()<=now).sort((a,b)=>a.nextFollowUpAt.localeCompare(b.nextFollowUpAt)); }
// rank: 1 = priority contact, 2 = normal (default), 3 = long shot. Rank first, then firm priority.
// Today's focus: settings.focus = {firms:[ids], date:"YYYY-MM-DD"}. Applies only on that date, so it resets at midnight.
function activeFocus(){ const f=S.settings.focus; return f && f.date===todayKey() && (f.firms||[]).length ? f : null; }
function focusQueue(){ const f=activeFocus(); return f ? queue().filter(c=>f.firms.includes(c.firmId)) : queue(); }
async function setFocus(firms){ const ok=await write("settings","main",{...S.settings, focus: firms.length?{firms,date:todayKey()}:null},"set"); if(ok) toast(firms.length?"Today's focus set. The board shows only "+firms.map(id=>shortFirm(firmName(id))).join(" + ")+".":"Focus cleared. The whole book is back on the board."); }
function queue(){ return contactsArr().filter(c=>c.stage==="todo").sort((a,b)=>(a.rank??2)-(b.rank??2) || (S.firms.get(a.firmId)?.priority??99)-(S.firms.get(b.firmId)?.priority??99) || (a.createdAt||"").localeCompare(b.createdAt||"")); }
function variantSends(vid){ let n=0; for(const c of S.contacts.values()) if(c.variantId===vid && c.sentAt) n++; return n; }
// Auto-pick a hook. A contact's own variantPref wins. Alumni-only hooks never go to non-alumni, and prefOnly hooks are used only when a contact asks for them.
function pickVariant(c){
  const pref=S.variants.get(c.variantPref); if(pref && pref.active!==false) return c.variantPref;
  const alum = c.source==="iona-alumni" || /Iona alum/i.test(c.notes||"");
  const act=[...S.variants.entries()].filter(([,v])=>v.active!==false && !v.prefOnly && (alum || !v.alumniOnly));
  const tiers=[ act.filter(([,v])=>v.firmId===c.firmId && v.persona===c.persona), act.filter(([,v])=>!v.firmId && v.persona===c.persona), act.filter(([,v])=>v.firmId===c.firmId), act.filter(([,v])=>!v.firmId) ];
  for(const t of tiers){ if(t.length){ t.sort((a,b)=>variantSends(a[0])-variantSends(b[0])); return t[0][0]; } }
  return act[0]?.[0]||"";
}

// ---------- writes ----------
async function write(col, id, data, mode="update"){
  if(!db){ toast("Database isn't connected in this view, so changes can't be saved."); return false; }
  try{ const ref=db.collection(col).doc(id); if(mode==="set") await ref.set(data); else if(mode==="delete") await ref.delete(); else await ref.update(data); return true; }
  catch(e){ if(e?.code==="invalid_argument" && mode!=="set"){ canWrite=false; } toast(e?.code==="quota_exceeded" ? "Storage is full. Delete old contacts to add more." : "Couldn't save ("+(e?.code||"error")+")."); return false; }
}
function touch(c, kind, extra={}){ const t=(c.touches||[]).slice(-40); t.push({at:nowISO(), kind, ...extra}); return t; }

async function markSent(cid, {variantId, subject}){
  const c=S.contacts.get(cid); if(!c) return;
  const v=S.variants.get(variantId)||{};
  const at=nowISO();
  const test={persona:c.persona, desire:v.desire||DESIRES[c.persona]||"", angle:v.angle||"", mechanism:v.mechanism||"", cta:v.cta||""};
  const ok=await write("contacts",cid,{stage:"sent", sentAt:at, lastTouchAt:at, variantId:variantId||"", subject, test, followUps:0, nextFollowUpAt:addBusinessDays(at,S.settings.followUpDays?.[0]||3), touches:touch(c,"email",{variantId})});
  if(ok) toast("Sent. Follow-up locked in for "+fmtDate(addBusinessDays(at,S.settings.followUpDays?.[0]||3))+".");
}
async function markFollowUp(cid){
  const c=S.contacts.get(cid); if(!c) return;
  const n=(c.followUps||0)+1; const at=nowISO(); const gaps=S.settings.followUpDays||[3,7];
  const next = n>=2 ? addBusinessDays(at,5) : addBusinessDays(at,(gaps[1]||7)-(gaps[0]||3));
  const ok=await write("contacts",cid,{stage:n>=2?"fu2":"fu1", followUps:n, lastTouchAt:at, nextFollowUpAt:next, touches:touch(c,"followup",{n})});
  if(ok) toast(n>=2?"Final follow-up logged. Marked no-reply in 5 business days if silent.":"Follow-up logged. Persistence closes.");
}
async function setStage(cid, stage){
  const c=S.contacts.get(cid); if(!c) return;
  const patch={stage, lastTouchAt:nowISO(), touches:touch(c,"stage",{stage})};
  if(REPLIED.includes(stage) && !c.repliedAt) patch.repliedAt=nowISO();
  if(!AWAITING.includes(stage)) patch.nextFollowUpAt="";
  if(stage==="todo"){ patch.sentAt=""; }
  await write("contacts",cid,patch);
}
// Auto-close: contacts whose last follow-up is overdue become "No reply". Runs once per load after data arrives.
let autoClosed=false;
async function autoClose(){
  if(autoClosed||!db||!canWrite) return; autoClosed=true;
  const now=Date.now();
  for(const c of contactsArr()){
    if(c.stage==="fu2" && c.nextFollowUpAt && new Date(c.nextFollowUpAt).getTime()<now){
      await write("contacts",c.__id,{stage:"noreply",nextFollowUpAt:"",touches:touch(c,"stage",{stage:"noreply",auto:true})});
    }
  }
}

}

    <div class="panel kpi"><span class="label">Calls / referrals</span><span class="val">${pos.length}</span><span class="sub">${pct(pos.length,sent.length)}% of emailed</span></div>

      <div class="panel list">${due.length? due.slice(0,25).map(c=>`
        <div class="item"><div class="who"><b>${esc(c.name)}</b> ${liLink(c)} ${personaTag(c.persona)}<div class="meta">${esc(firmName(c.firmId))} · ${stageChip(c.stage)} · last touch ${fmtDate(c.lastTouchAt)}</div></div>
        <div class="row"><button class="btn small primary" data-act="compose" data-id="${c.__id}" data-mode="fu">Follow up</button></div></div>`).join("")

    </section>

      <div class="spread"><div><h2>On the board · ${q.length} to contact</h2>

function emailsSent(sinceMs=0){ let n=0; for(const c of S.contacts.values()) for(const t of (c.touches||[])) if((t.kind==="email"||t.kind==="followup") && new Date(t.at).getTime()>=sinceMs) n++; return n; }
function bannerLine(){
  const sent=emailsSent(), goal=S.settings.dailyGoal||50, today=touchesOn(todayKey(),["email","followup"]);
  if(sent>=TARGET) return "1,000 sent. That's wolf status. Now turn those calls into offers.";
  if(today>=goal) return `${today} out the door today. That's how a closer finishes the day.`;
  const d=Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/86400000);
  return BANNER_LINES[d % BANNER_LINES.length];
}
function viewRoad(){
  const sent=emailsSent(), reached=sentContacts().length, goal=S.settings.dailyGoal||50;
  const left=Math.max(0,TARGET-sent), p=Math.min(100,sent/TARGET*100);
  const pace=emailsSent(Date.now()-7*86400000)/5; // per weekday over the last 7 days
  const etaGoal=left?fmtDate(addBusinessDays(Date.now(),Math.ceil(left/goal))):"Done";
  const etaPace=!left?"Done":pace>0?fmtDate(addBusinessDays(Date.now(),Math.ceil(left/pace))):"Start sending";
  const next=MILESTONES.find(([n])=>sent<n);
  const cs=sentContacts();
  const replied=cs.filter(c=>REPLIED.includes(c.stage)).length, calls=cs.filter(c=>POSITIVE.includes(c.stage)).length;
  const refs=cs.filter(c=>c.stage==="referral"||c.stage==="interview").length, ints=cs.filter(c=>c.stage==="interview").length;
  const steps=[["Emailed",reached],["Replied",replied],["Call booked",calls],["Referral",refs],["Interview",ints]];
  const real=sent>=30;
  const rate=real?{r:replied/sent,c:calls/sent,f:refs/sent,i:ints/sent}:{r:.07,c:.03,f:.01,i:.005};
  const proj=k=>Math.round(rate[k]*TARGET);
  // Avatar lanes: everyone in the book, split by who they are.
  const lanes=PERSONAS.map(p=>{ const all=contactsArr().filter(c=>c.persona===p); const s=all.filter(c=>c.sentAt);
    const seg={todo:all.filter(c=>c.stage==="todo").length, wait:all.filter(c=>AWAITING.includes(c.stage)).length, rep:all.filter(c=>c.stage==="replied").length, pos:all.filter(c=>POSITIVE.includes(c.stage)).length, dead:all.filter(c=>["noreply","declined","bounced"].includes(c.stage)).length};
    return {p, total:all.length, sent:s.length, rep:s.filter(c=>REPLIED.includes(c.stage)).length, pos:seg.pos, seg}; });
  const totalSent=lanes.reduce((a,l)=>a+l.sent,0)||1;
  const segColors={todo:"var(--line)",wait:"var(--info)",rep:"var(--warn)",pos:"var(--ok)",dead:"var(--bad)"};
  return `
  <section class="panel road">
    <div class="spread" style="align-items:flex-end">
      <div><span class="eyebrow">Road to 1,000</span><h2 class="road-title">${sent.toLocaleString()} <small>of 1,000 emails sent</small></h2></div>
      <div class="sub" style="text-align:right">${next?`Next milestone: <b style="color:var(--ink)">${next[1]}</b><br>${(next[0]-sent).toLocaleString()} emails away`:`<b style="color:var(--ink)">Wolf status.</b><br>Now turn those calls into offers.`}</div>
    </div>
    <div class="road-track" role="progressbar" aria-label="Emails sent toward 1,000" aria-valuemin="0" aria-valuemax="${TARGET}" aria-valuenow="${sent}"><b style="width:${p}%"></b>${MILESTONES.map(([n])=>`<i class="${sent>=n?"hit":""}" style="left:${n/TARGET*100}%"><span>${n}</span></i>`).join("")}</div>
    <div class="miles">${MILESTONES.map(([n,l])=>`<div class="mile ${sent>=n?"hit":next&&next[0]===n?"next":""}"><b>${n.toLocaleString()}</b>${esc(l)}</div>`).join("")}</div>
    <div class="stats">
      <div class="stat"><span class="label">People reached</span><span class="v">${reached}</span></div>
      <div class="stat"><span class="label">Your pace</span><span class="v">${pace?pace.toFixed(1):"0"}<small class="sub"> / weekday</small></span></div>

function dimKey(c, dim){ if(dim==="variant") return c.variantId? (S.variants.get(c.variantId)?.subject||c.subject||c.variantId) : ""; if(dim==="firm") return shortFirm(firmName(c.firmId)); if(dim==="persona") return c.test?.persona||c.persona; return c.test?.[dim]||""; }
function dimTable(dim,label){
  const g=new Map(); for(const c of sentContacts()){ const k=dimKey(c,dim); if(!k) continue; const r=g.get(k)||{n:0,r:0,p:0}; r.n++; if(REPLIED.includes(c.stage)) r.r++; if(POSITIVE.includes(c.stage)) r.p++; g.set(k,r); }
  const rows=[...g.entries()].sort((a,b)=>(b[1].r/b[1].n)-(a[1].r/a[1].n)||b[1].n-a[1].n);
  return `<div class="panel"><div class="pad" style="padding-bottom:6px"><h3>${esc(label)}</h3></div>${rows.length?`<div class="tablewrap"><table><thead><tr><th>${esc(label)}</th><th class="n">Sent</th><th class="n">Replies</th><th style="width:90px">Reply %</th><th class="n">Calls</th></tr></thead><tbody>${rows.slice(0,dim==="variant"?12:10).map(([k,r])=>`<tr><td>${esc(k)}${r.n<20?' <span class="lowN">low n</span>':""}</td><td class="n">${r.n}</td><td class="n">${r.r}</td><td><div class="row" style="flex-wrap:nowrap;gap:6px"><div class="bar" style="flex:1"><b style="width:${pct(r.r,r.n)}%"></b></div><span class="num" style="font-size:12px">${pct(r.r,r.n)}%</span></div></td><td class="n">${r.p}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty" style="padding-top:4px">Results appear here once you log emails as sent.</div>`}</div>`;
}

function viewPlaybook(){
  const cards=[
    ["00 · Mindset","Act as if. Keep the emails clean.",`<p>Bring the Belfort energy to the work, not the inbox. Your emails to bankers stay calm, specific and short. Confidence shows up as a clear ask and real proof (ER shifts, the Ivanhoe pitch), never hype. The swagger lives in this app, not in your subject lines.</p>`],
    ["01 · This week","Morgan Stanley first",`<p>Early Insights closes <b>Oct 30, 11:55 p.m. ET</b>. Submit the application this week, then email Monique Jean and Carlos Muñoz (both Iona alumni). An alum is the highest-reply contact you have. Leerink, Synchrony and First Citizens are open and rolling, so they come next.</p>`],
    ["02 · Volume","50 a day needs about 1,000 names",`<p>The PDF names 22 people. At 50 a day you'd use them up before lunch. Build each firm out to 20–40 people:</p><ul><li>LinkedIn: search the firm, filter by <b>School: Iona</b>, then by titles like Analyst and Associate.</li><li>Add more firms: healthcare banks (Cain Brothers/KeyBanc, Ziegler, Torreya, Jefferies HC), elite boutiques (Evercore, PJT, Moelis, Houlihan Lokey), and Stamford/Greenwich shops (UBS Stamford, Point72, Viking, AQR, Silver Point, Tudor).</li><li>Mix: about 70% analysts and associates (1–4 years out), 20% VPs, 10% MDs and recruiters. Junior bankers reply the most and remember what recruiting felt like.</li></ul>`],
    ["03 · Deliverability","Protect your inbox before you scale",`<ul><li>Send from your <b>@iona.edu</b> address. Bankers open .edu mail from students.</li><li>Ramp up: about 15 a day in week one, 30 in week two, then 50. A new mailbox that jumps straight to 50 cold emails a day gets flagged as spam.</li><li>Verify every pattern-based address (Hunter, NeverBounce). If more than 5% bounce, your later emails start landing in spam.</li><li>Plain text. No links, images or attachments in the first email. Give each one a personal first line.</li><li>Send Tue–Thu, 6:30–8 a.m. ET or around 6 p.m. Skip Fridays and weekends.</li></ul>`],
    ["04 · The ask","Ask for 10 minutes, not a job",`<p>The first email asks for a short call or one specific question. Keep the body under 90 words and write subject lines under 8 words. Only gatekeepers get application-specific asks. Save the resume for after they reply, unless they ask for it first.</p>`],
    ["05 · Follow-ups","Most replies come from the follow-up",`<p>The tracker schedules a bump after 3 business days and a final note after 7. Reply in the same thread with 1–2 lines. After two follow-ups, stop. A third email reads as pushy at a small firm where everyone talks.</p>`],
    ["06 · Testing","One variable at a time",`<ul><li>The recipient sets the avatar, so you can't test it. Within one avatar, test angle first (ER story vs. Iona vs. stock pitch). That's where the biggest differences show up.</li><li>Give each arm 30–50 sends before you call a winner. Until then a 2-reply difference is noise.</li><li>Once an angle wins, test hooks, then CTAs. Pause losers so new sends rotate into the winners.</li><li>Use <b>Make variations</b> on your best hook to spin out three versions that each change one variable.</li></ul>`],
    ["07 · Multichannel","Pair every email with LinkedIn",`<p>Send a connection request the same day, with a note under 300 characters: “Iona finance sophomore and Stamford ER EMT. Just emailed you about [firm]'s program. Would value connecting.” Save the LinkedIn URL in the tracker. Do it by hand. LinkedIn bans accounts that use automation tools.</p>`],
    ["08 · The call","Turn calls into referrals",`<ul><li>Have a 30-second story ready: ER shifts → why finance → why this firm, why this group.</li><li>Ask about their path, what separates great interns, and what they'd do as a sophomore in your shoes.</li><li>Always close with: “Is there anyone else you think I should talk to?” Log the names as new people.</li><li>Send a thank-you within 24 hours. Two weeks later, send an update on something they suggested. When applications open, ask if they'd flag your application, and mark them Referral.</li></ul>`],
    ["09 · Be ready","Outreach gets the interview; prep wins it",`<ul><li>Technicals: accounting flow-through, DCF, comps, EV vs. equity value, plus a few LBO basics. Work through the BIWS/WSO 400-question guide.</li><li>Healthcare: know one recent deal per target bank and one sub-sector view (e.g., provider margins, GLP-1s, behavioral health roll-ups).</li><li>Keep the Ivanhoe/rare-earths pitch to 2 minutes, and know its weak point.</li><li>Apply the day each posting opens. Outreach backs up an application; it doesn't replace one.</li></ul>`],
    ["10 · Accuracy","Don't overclaim",`<p>Bankers check. Say “SIE in November” until you pass it. Phrase rankings exactly as they happened (“top 500 of 1,400+”). Keep claims about December 2028 eligibility to a question, as the Leerink and Morgan Stanley gatekeeper hooks do.</p>`],
  ];
  return `<section class="section"><h2>The Straight Line</h2><p class="sub" style="max-width:75ch">The playbook. Run 50 a day with conviction, keep your inbox and your reputation clean, and turn replies into an offer.</p>
  <div class="play">${cards.map(([k,t,b])=>`<article class="panel"><span class="k">${k}</span><h3>${t}</h3>${b}</article>`).join("")}</div></section>`;
}

// ---------- Gmail ----------
function gmErr(e){ const c=e?.code; return c==="server_not_connected"||c==="server_not_found"?"Gmail isn't connected to your claude.ai account yet.":c==="not_granted"||c==="consent_required"?"Gmail access wasn't allowed for this page.":c==="needs_reauth"?"Reconnect Gmail in claude.ai settings.":c==="rate_limited"?"Gmail is rate-limiting. Try again in a minute.":"Gmail request failed ("+(c||"error")+")."; }
async function gmDraft(to, subject, body){ return mcp.callTool(GMAIL,"create_draft",{to:[to],subject,body},{cache:false}); }
async function draftFromCompose(){
  const to=$("#cm-to").value.trim(); if(!to){ toast("Add an email address first."); return; }
  const btn=$('[data-act="gm-draft"]'); btn.disabled=true; btn.textContent="Creating…";
  try{ await gmDraft(to,$("#cm-subject").value,$("#cm-body").value); toast("Draft created in Gmail. Logging it as sent; review and send it from Gmail."); await logComposed(); }
  catch(e){ toast(gmErr(e)); btn.disabled=false; btn.textContent="Create Gmail draft"; }
}
async function bulkDraft(kind){
  const list = kind==="fu" ? dueFollowUps().slice(0,15) : focusQueue().filter(c=>c.email).slice(0,10);
  if(!list.length){ toast(kind==="fu"?"No follow-ups due.":"No one in the queue has an email address."); return; }
  let n=0; toast(`Creating ${list.length} Gmail drafts…`);
  for(const c of list){
    try{
      if(kind==="fu"){ const k=(c.followUps||0)+1; await gmDraft(c.email, fill(k>=2?S.settings.fu2Subject:S.settings.fu1Subject,c), fill(k>=2?S.settings.fu2Body:S.settings.fu1Body,c)); await markFollowUp(c.__id); }
      else { const vid=pickVariant(c), v=S.variants.get(vid); if(!v) continue; const subj=fill(v.subject,c); await gmDraft(c.email, subj, fill(v.body,c)); await markSent(c.__id,{variantId:vid,subject:subj}); }
      n++;
    }catch(e){ toast(gmErr(e)+` Stopped after ${n}.`); return; }
  }
  toast(`${n} drafts are in Gmail and logged as sent. Review each one and send it from Gmail.`);
}
async function checkReplies(){
  const btn=$('[data-act="gm-check"]'); if(btn){ btn.disabled=true; btn.textContent="Checking…"; }
  const watch=contactsArr().filter(c=>c.email&&(AWAITING.includes(c.stage)||c.stage==="noreply"));
  let found=0;
  try{
    for(let i=0;i<watch.length;i+=15){
      const chunk=watch.slice(i,i+15);
      const query="("+chunk.map(c=>"from:"+c.email).join(" OR ")+") newer_than:60d";
      const res=await mcp.callTool(GMAIL,"search_threads",{query,pageSize:50},{cache:false});
      const text=JSON.stringify(res?.payload??res?.content??"").toLowerCase();
      for(const c of chunk){ if(text.includes(c.email.toLowerCase())){ await setStage(c.__id,"replied"); found++; } }
    }
    toast(found?`${found} new ${found===1?"reply":"replies"} found and moved to Replied.`:"No new replies yet.");
  }catch(e){ toast(gmErr(e)); }
  if(btn){ btn.disabled=false; btn.textContent="Check replies"; }
}

    case "edit-variant": variantForm(S.variants.get(id),id); break;
    case "save-variant": t.disabled=true; await saveVariant(id,t.dataset.parent); t.disabled=false; break;
    case "toggle-variant": { const v=S.variants.get(id); await write("variants",id,{active:v.active===false}); break; }
    case "ai-vary": aiVary(id); break;
    case "ai-save": aiSave(Number(t.dataset.i),t); break;
    case "paste": pasteForm(); break;
    case "paste-save": t.disabled=true; await pasteSave(); t.disabled=false; break;
  }
});
$("#scrim").addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("#drawer").hidden) closeDrawer(); });
document.addEventListener("change", async e=>{
  const t=e.target;
  if(t.matches('select[data-act="stage"]')){ await setStage(t.dataset.id,t.value); return; }
  if(t.id==="f-firm"){ S.f.firm=t.value; render(); } else if(t.id==="f-stage"){ S.f.stage=t.value; render(); } else if(t.id==="f-persona"){ S.f.persona=t.value; render(); }
  else if(t.id==="vf-firm"){ S.vf.firm=t.value; render(); } else if(t.id==="vf-persona"){ S.vf.persona=t.value; render(); }
  else if(t.id==="cm-variant"){ const c=S.contacts.get(composeCtx?.cid), v=S.variants.get(t.value); if(c&&v){ $("#cm-subject").value=fill(v.subject,c); $("#cm-body").value=fill(v.body,c); updateComposeMeta(); } }
  else if(t.id==="focus-sel"){ if(t.value!=="__cur") await setFocus(t.value?[t.value]:[]); }
  else if(t.id==="cf-firm"){ $("#cf-newfirm-wrap").hidden = t.value!=="__new"; }
  else if(t.id==="vf2-persona"){ const d=$("#vf2-desire"); if(d && Object.values(DESIRES).includes(d.value)) d.value=DESIRES[t.value]; }
});
document.addEventListener("input", e=>{
  if(e.target.id==="f-q"){ S.f.q=e.target.value; renderFocus="f-q"; clearTimeout(render._q); render._q=setTimeout(()=>{ render(); renderFocus=""; },180); }
  if(e.target.id==="cm-body") updateComposeMeta();
  if(e.target.id==="paste-box"){ const r=parsePaste(); $("#paste-preview").textContent=r.length?`${r.length} ${r.length===1?"person":"people"} ready to add.`:""; }
});
document.addEventListener("submit", async e=>{
  if(e.target.id!=="settings-form") return; e.preventDefault();
  const fu=$("#s-fu").value.split(/[,\s]+/).map(Number).filter(n=>n>0).slice(0,2);
  const data={dailyGoal:Math.max(1,Number($("#s-goal").value)||50),followUpDays:fu.length===2?fu:[3,7],signature:$("#s-sig").value,fu1Subject:$("#s-fu1s").value,fu1Body:$("#s-fu1b").value,fu2Subject:$("#s-fu2s").value,fu2Body:$("#s-fu2b").value};
  if(await write("settings","main",{...S.settings,...data},"set")) toast("Settings saved.");
});

// ---------- boot ----------
try{ const v=localStorage.getItem("od-view"); if(v) S.view=v; }catch{}
render();
(async()=>{
  const C=window.claude;
  if(!C?.use){ db=null; S.loaded={firms:true,contacts:true,variants:true}; render(); return; }
  db=await C.use("db");
  $("#c-db").classList.toggle("on",!!db);
  if(!db){ render(); return; }
  try{ const u=await C.use("user"); const w=await u?.can?.("data.write"); if(w===false) canWrite=false; }catch{}
  const sub=(name,map)=>db.collection(name).onSnapshot(snap=>{ map.clear(); for(const d of snap.docs){ map.set(d.id,{...d.data(),__id:d.id}); } S.loaded[name]=true; if($("#drawer").hidden) render(); else softRender(); if(name==="contacts") autoClose(); }, err=>{ S.loaded[name]=true; toast("Lost the live connection to your data ("+err.code+"). Reload the page."); render(); });
  sub("firms",S.firms); sub("contacts",S.contacts); sub("variants",S.variants);
  db.doc("settings/main").onSnapshot(s=>{ if(s.exists) Object.assign(S.settings,s.data()); if($("#drawer").hidden) render(); },()=>{});
  C.use("sample").then(s=>{ sample=s; $("#c-ai").classList.toggle("on",!!s); if(s && S.view==="tests" && $("#drawer").hidden) render(); });
  C.use("mcp").then(m=>{ mcp=m; $("#c-gm").classList.toggle("on",!!m); if(m && $("#drawer").hidden) render(); });
})();
// While a drawer is open, re-render the page underneath without touching the drawer.
function softRender(){ const d=$("#drawer"); const keep=d.hidden; render(); d.hidden=keep; }
})();
</script>
